name: CI

on:
  # Only the default branch on push. Without the filter a push to a branch with an open PR fires
  # `push` and `pull_request` (synchronize) at once, and `concurrency` cannot dedupe them because
  # `github.ref` is `refs/heads/<branch>` for one and `refs/pull/N/merge` for the other.
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint:js

      - name: Lint styles
        run: npm run lint:css

      # docs/SUPPORTED-VIEWS.md is generated from the FIELD constants and the resolver source.
      # The suite checks the same thing (scripts/__tests__/view-reference.contract.test.js, so all
      # four legs cover it), but this step runs the CLI and names the failure for what it is.
      - name: Check the generated view reference
        run: npm run docs:views:check

      # docs/SUPPORTED-PROPS.md is generated from the semantic-ui-react wrapper source,
      # domProps.js and the Table call sites (UPGRADE-PLAN 9.7-F1 step 0). It is the parity
      # checklist steps 1-3 are judged against, so it has to fail loudly rather than rot.
      # scripts/__tests__/wrapper-prop-reference.contract.test.js covers it in all four legs
      # and additionally walks the tracked example corpus; this step names the failure.
      - name: Check the generated supported-prop reference
        run: npm run docs:props:check

      - name: Test with coverage thresholds
        run: npm run test:coverage

      - name: Build library
        run: npm run build-lib

      - name: Check public TypeScript declarations
        run: npm run test:types:consumer

      - name: Check packaging budgets
        run: npm run test:pack:budget

      - name: Smoke the packed tarball
        run: npm run test:pack:consumer

      # The step above only ever sees the React the lockfile installs, so the declared 16.14 and 17 ends of
      # peerDependencies had no runtime coverage at all. This re-runs the same smoke against React installed
      # into a throwaway directory — the repository's own node_modules is never touched. It checks the
      # published artifact, which is what a peer range is a claim about; it is not a substitute for running
      # the suite on those versions (see docs/UPGRADE-PLAN.md §8, "CI coverage of the declared peer range").
      - name: Smoke the packed tarball across the declared peer range
        run: npm run test:pack:peers

      - name: Build demo
        run: npm run build

  # Gating. `peerDependencies` declares a 16.14 floor, but `npm ci` installs exactly one React, so the
  # `verify` job above only ever exercises 18; `test:pack:peers` proves the published artifact server-renders
  # on 16 and 17, which is narrower than running the suite. This runs the whole suite on React 16.14.
  #
  # No `--legacy-peer-deps` here, unlike `react-19-advisory` below: React 16.14 comes from an install-only
  # fixture package (`scripts/fixtures/react16-floor`, linked as the `react-16-floor` devDependency), so npm
  # nests it instead of competing for the hoisted `node_modules/react` slot and plain `npm ci` installs it.
  # Aliased devDependencies -- the trick `react-types-16` uses -- cannot work for a runtime package, because
  # `react-dom@16.14.0` peer-requires `react` and npm resolves that against the hoisted copy React 18 owns.
  #
  # Green here means the SAME suite and test totals as the React 18 leg — this job excludes nothing and
  # skips nothing of its own. Deliberately not pinning the numbers here: they went stale four times in
  # one change, since every added test invalidates them, and the invariant is what actually matters.
  # The only skips are the CSS parity suite's published-artifact block, which needs `static/` — that is
  # git-ignored, so it cannot exist on a clean checkout. Any other skip or a total that differs from the
  # React 18 leg means this leg silently stopped running something.
  # jest.react16.config.js and scripts/fixtures/react-legacy/harness.js assert the React that actually loaded,
  # so a mapping that silently fell back to 18 fails every suite instead of reporting a false green.
  react-16-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test on the React 16.14 peer floor
        run: npm run test:react16

  # Gating, and the other half of the peer matrix: `peerDependencies` declares `^16.14 || ^17 || ^18`, and
  # with this leg every one of the three ends runs the whole suite (18 in `verify`, 16.14 above, 17 here)
  # rather than only the packed-artifact smoke `test:pack:peers` gives 17. Same shape as `react-16-floor`:
  # React 17.0.2 comes from an install-only fixture package (`scripts/fixtures/react17-floor`, linked as the
  # `react-17-floor` devDependency), so plain `npm ci` installs it and no `--legacy-peer-deps` is needed.
  # 17 needs the fixture even more than 16 does: react-dom@17.0.2 peer-requires `react` at the EXACT version,
  # which npm resolves against the hoisted copy React 18 owns.
  #
  # Deliberately a second job rather than a matrix over [16, 17] on one job: a matrix would rename the
  # existing `react-16-floor` job and silently drop it out of any branch-protection required-check list.
  # Nothing is shared by running them together anyway -- each leg gets its own runner and its own `npm ci`.
  #
  # Green here means the same suite and test totals as the React 18 and 16.14 legs, with nothing excluded
  # (see the react-16-floor comment above for why the numbers are not pinned and what may legitimately skip).
  # The same two-level self-check applies (jest.react17.config.js in the parent process,
  # scripts/fixtures/react-legacy/harness.js in every worker), so a mapping that silently fell back to the
  # installed 18 fails every suite with zero tests run instead of reporting a false green.
  react-17:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test on React 17.0.2
        run: npm run test:react17

  # Gating. The browser leg of the contract suite (docs/UPGRADE-PLAN.md §9.5, §9.7-F1 step 2): the
  # positional facts about the tooltip that no jsdom suite can express, because every
  # `getBoundingClientRect()` there is 0x0. It records what semantic-ui-react's `Popup` actually does
  # in real Chrome so the in-house replacement has a measured reference to be judged against.
  #
  # GATING FROM DAY ONE, not advisory, and the distinction matters here. The product is currently
  # broken at these use sites — the bubble is unpositioned and popper throws on every open — so the
  # obvious reading is "red for a real reason, keep it off the merge path". That would be the wrong
  # call: red-because-the-product-is-broken belongs in a PINNED CURRENT VALUE, exactly as
  # `FIXED_PROP_LEAKS`, `KNOWN_DOM_DEFECTS` and `NAMELESS_CONTROLS` already work in jest. Every such
  # fact is pinned in e2e/reference.js and tagged [R->I], so the suite is green today, gates today,
  # and the diff that flips a pin is the reviewable record that part 2 fixed something.
  # `continue-on-error` would be justified only by observed FLAKE, and the two known flake sources
  # (network webfonts, animation timing) are removed at the fixture level rather than tolerated.
  #
  # A SEPARATE JOB rather than a step inside `verify`: folding it in would add its whole serial cost
  # to the critical path, while a parallel job adds nothing to developer wait time as long as it
  # finishes inside `verify`. Deliberately NOT pinning a test count in this comment — that has gone
  # stale four times in this workstream. The invariant instead: this job asserts the browser-only
  # facts in e2e/reference.js, and every one of them is tagged as a reference, an invariant, or a
  # pinned defect. A failure means either a real regression or a value that legitimately moved and
  # was not re-measured; it never means "the numbers drifted".
  #
  # WHY IT SERVES A PRODUCTION BUILD. webpack-dev-server renders an unhandled runtime error as a
  # full-viewport overlay iframe, and opening a tooltip currently throws — so on the dev server the
  # overlay intercepts every subsequent interaction. Disabling that overlay would remove a real
  # debugging affordance from humans to suit a test runner. `playwright.config.js` builds the demo
  # root-relative (`PUBLIC_PATH=/`, `REACT_APP_BASE_NAME=/`, into `build-e2e/`) and serves it with
  # `serve --single`; both webpack overrides default to today's values, so `npm run build` and
  # `npm run deploy` are untouched.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `setup-node`'s `cache: npm` does NOT cover the Playwright browser cache, and the key has to
      # be the resolved Playwright version rather than the lockfile hash: any unrelated dependency
      # bump would otherwise throw away a perfectly good browser download. Measured locally:
      # `playwright install chromium` puts 567 MB on disk — 368 MB full Chromium plus a 196 MB
      # headless shell (the ~95 MiB download the run actually launches) plus 2.5 MB of ffmpeg.
      # `--only-shell` would cut that to ~196 MB, and is deliberately NOT used: a CI/local browser
      # split is exactly the kind of difference that makes a browser gate unreproducible, and the
      # full install is also what `--headed`/`--ui` debugging needs.
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The cache restores browser BINARIES, never the apt packages they link against, so the
      # cache-hit path still needs `install-deps`.
      - name: Install Chromium and its system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run the browser contract suite
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Advisory only — React 19 is NOT declared in peerDependencies (see docs/UPGRADE-PLAN.md §8).
  # Purpose: make upstream drift visible on every PR without gating it, so the 19 flip is a
  # measurement rather than a discovery. `continue-on-error: true` keeps a red leg off the merge path.
  react-19-advisory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `--legacy-peer-deps` is deliberate, not carelessness: two installed packages still declare
      # `react ^16.8.0 || ^17.0.0 || ^18.0.0` peers, so npm would abort this install with ERESOLVE.
      #   1. semantic-ui-react (bundled dependency — removed by §9.7-F1 step 3½)
      #   2. react-final-form 6.5.9 (19-ready line is 7.0.1 — §9.7-F4)
      # Both caps are tracked upgrades; the flag overrides the peer check for this throwaway install
      # only and never touches what we declare to consumers. `--no-save` leaves package.json alone.
      - name: Install React 19 over the lock
        run: npm install --no-save --legacy-peer-deps react@19 react-dom@19

      - name: Test on React 19
        run: npx jest
