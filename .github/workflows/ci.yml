name: CI

on:
  # Only the default branch on push. Without the filter a push to a branch with an open PR fires
  # `push` and `pull_request` (synchronize) at once, and `concurrency` cannot dedupe them because
  # `github.ref` is `refs/heads/<branch>` for one and `refs/pull/N/merge` for the other.
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint:js

      - name: Lint styles
        run: npm run lint:css

      - name: Test with coverage thresholds
        run: npm run test:coverage

      - name: Build library
        run: npm run build-lib

      - name: Check public TypeScript declarations
        run: npm run test:types:consumer

      - name: Build demo
        run: npm run build
