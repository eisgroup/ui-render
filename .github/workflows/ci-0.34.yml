name: CI (0.34)

# The 0.34 line is patched on this branch, not from master: master carries the next line, and a
# production fix for 0.34.x is made and published from here (docs/UPGRADE-PLAN.md on master, §10,
# decided 2026-08-18). This checks what such a patch ships: the jest suite and the library build.
#
# The actions are pinned to the SHAs master's CI used on 2026-10-12. Dependabot updates only the
# default branch's workflows, so these stay where they are until someone moves them by hand.
on:
  push:
    branches: [release/v0.34]
  pull_request:
    branches: [release/v0.34]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A PR's newer push supersedes the run before it. A push to the branch keeps its run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify (0.34)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # What a 0.34.x publish ships: the bundle (webpack), then its declarations (`gen-ts`).
      - name: Build the library
        run: npm run build-lib
