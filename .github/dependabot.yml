# Automated dependency updates (docs/UPGRADE-PLAN.md §9.9-H9, "Automated updates"), weekly.
#
# Every package here is a devDependency: the published package declares none, so these PRs change what
# builds and tests the library, and a bundled one what `dist/index.js` carries. CI gates each of them as it
# gates any PR, on every React of the peer range.
#
# A week's minor and patch updates arrive as one PR; each major is a PR of its own, because it is a
# migration to review, not a bump, except where packages can only move together: those majors arrive
# as one PR per family.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      # The form stack takes its majors together: react-final-form 7 and final-form-arrays 4 each peer on
      # final-form 5, so either one alone cannot install (`npm ci` failed with ERESOLVE on #164 and #166).
      # docs/UPGRADE-PLAN.md §9.7-F4 bumps the four in one PR, after a changelog audit.
      form-stack:
        patterns: [final-form, final-form-arrays, react-final-form, react-final-form-arrays]
        update-types: [major]
      # Babel's presets peer on the @babel/core of their own major, so @babel/core 8 alone cannot install
      # beside presets on 7 (#167).
      babel:
        patterns: ['@babel/*']
        update-types: [major]
    ignore:
      # Development and the default suite run on React 18.3 by decision. 16.14, 17 and 19 have fixture legs of
      # their own (scripts/fixtures/, pinned in scripts/fixtures/react-legacy/floors.js), which this does not
      # update: a React in the peer range is added there, deliberately, not bumped here.
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: '@types/react'
        update-types: [version-update:semver-major]
      - dependency-name: '@types/react-dom'
        update-types: [version-update:semver-major]
      # eslint-plugin-react, -import and -jsx-a11y declare peers only up to ESLint 9 (eslint.config.js says
      # why it is on 9). Drop this when they declare 10.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # TypeScript 7, the native compiler, exports only its version from `require('typescript')`: the compiler
      # API moved to `typescript/unstable/*`. scripts/gen-ts.js, which writes the package's declarations, its
      # contract test and src/demo/testing/contractTypes.js use that API, and typescript-eslint supports
      # TypeScript below 6.1. Drop this when they are ported and typescript-eslint declares 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
